name: Build Plugweaver
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev xvfb
      - name: Configure
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ;;
            Windows) cmake -S . -B build -A x64 -DBUILD_TESTING=ON ;;
            Linux)   cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON ;;
          esac
      - name: Build app
        run: cmake --build build --config Release --parallel 4
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi
      # Build the instrument exported by the self-test, so the plugin template is
      # verified on every platform too.
      - name: Build exported instrument
        shell: bash
        run: |
          src="$(ls -d build/test-output/*-Source | head -1)"
          echo "Exported source: $src"
          root="$PWD"
          extra=()
          if [ "$RUNNER_OS" = Windows ]; then root="$(pwd -W)"; extra=(-A x64); fi
          if [ "$RUNNER_OS" = macOS ]; then extra=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0); fi
          cmake -S "$src" -B plugin-build -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="$root/build/_deps/juce-src" "${extra[@]}"
          cmake --build plugin-build --config Release --parallel 4
          cmake --install plugin-build --config Release --component Plugins --prefix "$root/plugin-install"
          find plugin-install -maxdepth 2
      - name: Package app
        shell: bash
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS)
              codesign --force --deep --sign - "build/Plugweaver_artefacts/Release/Artilody Plugweaver.app"
              ditto -c -k --keepParent "build/Plugweaver_artefacts/Release/Artilody Plugweaver.app" "dist/Artilody-Plugweaver-macOS.zip" ;;
            Windows)
              7z a "dist/Artilody-Plugweaver-Windows.zip" "./build/Plugweaver_artefacts/Release/Artilody Plugweaver.exe" ;;
            Linux)
              tar -C build/Plugweaver_artefacts/Release -czf dist/Artilody-Plugweaver-Linux.tar.gz "Artilody Plugweaver" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: Artilody-Plugweaver-${{ matrix.name }}
          path: dist/
